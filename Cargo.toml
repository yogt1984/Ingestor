[package]
name = "ingestor"
version = "0.1.0"
edition = "2021"
default-run = "ingestor"

[dependencies]
tokio = { version = "1", features = ["full"] }  # Asynchronous runtime
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }  # WebSocket client with TLS support (upgraded from 0.16 to fix tungstenite DoS and openssl UAF)
futures-util = "0.3"  # Utilities for working with futures
serde_json = "1.0"  # JSON serialization/deserialization
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
crossbeam = "0.8"
linregress = "0.5"
thiserror = "1.0"
metrics = "0.20"
metrics-exporter-prometheus = "0.13"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
# Removed: serde_arrow, parquet2, arrow2 (unused dependencies with critical vulnerabilities)
rust_decimal = { version = "1.30", features = ["maths"] }  # <-- Keep this one (underscore)
rust_decimal_macros = "1.29"  # <-- Optional, but keep if needed
polars = { version = "0.46", features = ["parquet", "lazy", "json"] }  # Upgraded from 0.33.2 to fix arrow2/fast-float/lexical vulnerabilities
num = "0.4"
tempfile = "3.3.0"
ratatui = "0.29"  # Upgraded from 0.26 to fix compact_str vulnerability
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1.0", features = ["v4", "serde"] }  
sha2 = "0.10.9"
hex = "0.4.3"
indicatif = "0.18.3"
